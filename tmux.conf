# tmux settings for the dedicated "agents-away" socket (tmux -L agents-away).
# Your normal tmux server and config are not touched.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g extended-keys on
set -as terminal-features ",*:extkeys"
set -g escape-time 10
set -g focus-events on
set -g allow-passthrough off  # no raw escape sequences from agent output to your terminal
set -g history-limit 50000
set -g mouse on
set -g status off
set -g set-titles on
set -g set-titles-string "#T"
set -g window-size latest
set -g aggressive-resize on
set -g set-clipboard on
