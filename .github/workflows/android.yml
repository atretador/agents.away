name: Android app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["android/**", "package.json", ".github/workflows/android.yml"] # (not applied to tag pushes)
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (a tag can be moved; a commit can't). The comment is the
# version the SHA was taken from.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - name: Build (debug)
        run: ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agents-away-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # On a version tag (v1.2.3, matching package.json): sign the APK and publish the release with three downloads
  # (tools/package.sh): server-min, server-full (server + the app for its setup page) and the APK alone.
  # The signing key is in the "release" environment (secrets ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
  # ANDROID_KEY_ALIAS), which only runs after the maintainer approves it and only for v* tags. It's the same key
  # `agents-away apk build` uses on the maintainer's PC, so all of these builds update each other.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: true # a release never writes the shared Gradle cache
      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - name: Tag matches package.json
        run: |
          v=$(jq -r .version package.json)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but package.json says $v"; exit 1; }
      - name: Build (release, signed)
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          AWAY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AWAY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::ANDROID_KEYSTORE_B64 secret is not set"; exit 1; }
          export AWAY_KEYSTORE="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$AWAY_KEYSTORE"' EXIT
          (umask 077; echo "$KEYSTORE_B64" | base64 -d > "$AWAY_KEYSTORE")
          ./gradlew assembleRelease --console=plain
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -i "sha-256" | head -1
      - name: Package
        run: tools/package.sh android/app/build/outputs/apk/release/app-release.apk dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          # Release notes: this version's section of CHANGELOG.md, plus what each download is.
          awk -v v="$v" '$0 ~ "^## "v"( |$)" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ### Downloads
          - **agents-away-server-min-$GITHUB_REF_NAME.tar.gz**: the server and web app. Unpack, then run \`./install.sh\`.
          - **agents-away-server-full-$GITHUB_REF_NAME.tar.gz**: the same, plus the Android app, which the PC's setup page offers right away.
          - **agents-away-$GITHUB_REF_NAME.apk**: the Android app on its own (Android 10+).
          - **SHA256SUMS**: checksums of all three.
          EOF
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "Agents Away $v" --notes-file notes.md
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
