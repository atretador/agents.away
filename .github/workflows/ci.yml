name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Shells and tmux (the wrapper tests run in bash and zsh)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux zsh
      - run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun test
      - name: Syntax check (server, app, demo)
        run: bun run check
      - name: Shell scripts (syntax)
        run: bash -n install.sh bin/agents-away-certs shell/claude.sh
      - name: Shell scripts (shellcheck)
        run: shellcheck --severity=error install.sh bin/agents-away-certs shell/claude.sh
